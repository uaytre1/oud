<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Oud Coach design concept: wood, ink and the rosette (mockup, not the app)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Concept "wood, ink and the rosette" (2026-11-27). A mockup only: no app code uses this file. */
:root {
  --paper: #F6EFE2; --paper2: #EFE5D3; --ink: #241A12; --ink2: #5A4A3C; --walnut: #6B4428; --brass: #A8761F;
  --brass-ink: #FFF8EA; --line: #DCCDB4; --good: #2F6B45; --bad: #A33A2E;
  --serif: 'Fraunces', Georgia, serif; --sans: -apple-system, 'SF Pro Text', system-ui, sans-serif;
  --ar: 'Amiri', 'Noto Naskh Arabic', serif; --ar2: 'Noto Naskh Arabic', serif;
}
.night { --paper: #17110C; --paper2: #221911; --ink: #F3E8D6; --ink2: #BCA98F; --walnut: #C9A27A; --brass: #D9A441;
  --brass-ink: #1B130C; --line: #3A2C20; --good: #6DBB86; --bad: #E07A6C; }
body { margin: 0; background: #d9d3c9; font-family: var(--sans); padding: 24px; }
.frames { display: flex; gap: 22px; flex-wrap: wrap; }
.phone { width: 390px; height: 760px; background: var(--paper); color: var(--ink); border-radius: 28px; overflow: hidden;
  position: relative; box-shadow: 0 10px 30px rgba(0,0,0,.18);
  background-image: radial-gradient(rgba(107,68,40,.05) 1px, transparent 1px); background-size: 6px 6px; }
.label { font: 600 15px var(--sans); color: #3b342c; margin: 0 0 8px 4px; }
.top { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 6px; }
.brand { display: flex; align-items: center; gap: 10px; font: 650 22px var(--serif); letter-spacing: .2px; }
.ros { width: 30px; height: 30px; color: var(--brass); }
.gear { width: 26px; height: 26px; stroke: var(--ink2); fill: none; stroke-width: 1.8; }
.today { padding: 14px 22px 0; }
.eyebrow { font: 600 13px var(--sans); letter-spacing: 1.4px; text-transform: uppercase; color: var(--brass); }
h1 { font: 650 34px/1.08 var(--serif); margin: 6px 0 6px; }
.sub { font: 400 17px/1.4 var(--sans); color: var(--ink2); margin: 0 0 18px; }
.cta { display: flex; align-items: center; justify-content: center; gap: 10px; height: 58px; border-radius: 16px;
  background: var(--brass); color: var(--brass-ink); font: 650 19px var(--sans); border: 0; width: 100%; }
.neck { margin: 22px 0 6px; position: relative; height: 54px; }
.neck .wood { position: absolute; left: 0; right: 0; top: 18px; height: 18px; border-radius: 9px;
  background: linear-gradient(90deg, var(--walnut), color-mix(in srgb, var(--walnut) 70%, var(--paper))); opacity: .9; }
.neck .str { position: absolute; left: 6px; right: 6px; height: 1px; background: color-mix(in srgb, var(--paper) 70%, transparent); }
.stops { position: absolute; left: 0; right: 0; top: 10px; display: flex; justify-content: space-between; padding: 0 2px; }
.stop { width: 34px; height: 34px; border-radius: 50%; background: var(--paper); border: 2px solid var(--walnut);
  display: grid; place-items: center; font: 650 14px var(--sans); color: var(--ink2); }
.stop.here { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); box-shadow: 0 0 0 5px color-mix(in srgb, var(--brass) 25%, transparent); }
.necklbl { display: flex; justify-content: space-between; font: 500 13px var(--sans); color: var(--ink2); margin-top: 6px; }
.rows { margin: 18px 22px 0; border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 14px; padding: 15px 0; border-bottom: 1px solid var(--line); }
.row svg { width: 26px; height: 26px; stroke: var(--brass); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.row b { font: 600 17px var(--sans); display: block; }
.row small { font: 400 14px var(--sans); color: var(--ink2); }
.row .go { margin-left: auto; font: 600 15px var(--sans); color: var(--brass); }
.ring { width: 26px; height: 26px; flex: none; }
.song { font: 700 22px var(--ar2); }
/* lesson */
.bar { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 4px; }
.back { font: 400 30px var(--sans); color: var(--brass); width: 30px; }
.title { font: 600 16px var(--sans); }
.title .ar { font: 700 18px var(--ar2); }
.steps { display: flex; gap: 0; margin: 10px 22px 0; border-bottom: 1px solid var(--line); }
.steps span { flex: 1; text-align: center; padding: 10px 0 11px; font: 600 15px var(--sans); color: var(--ink2); }
.steps span.on { color: var(--ink); box-shadow: inset 0 -3px 0 var(--brass); }
.hear { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin: 12px 22px 0; font: 500 14px var(--sans); color: var(--ink2); }
.hear .ar { font: 700 20px var(--ar2); color: var(--ink); }
.meter { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.meter i { display: block; width: 62%; height: 100%; background: var(--good); }
.note { text-align: center; margin-top: 4px; }
.note .big { font: 700 118px/1.5 var(--ar); color: var(--ink); height: 150px; overflow: visible; }
.note .where { font: 600 19px var(--sans); margin-top: 26px; }
.note .ok { display: inline-flex; align-items: center; gap: 6px; font: 600 15px var(--sans); color: var(--good); margin-top: 6px; }
.fret { margin: 18px 22px 0; position: relative; height: 112px; border-radius: 14px; background: var(--paper2); border: 1px solid var(--line); }
.fret .s { position: absolute; left: 34px; right: 14px; height: 2px; background: var(--walnut); opacity: .55; }
.fret .n { position: absolute; left: 12px; font: 600 12px var(--sans); color: var(--ink2); }
.fret .dot { position: absolute; width: 28px; height: 28px; border-radius: 50%; background: var(--brass); color: var(--brass-ink);
  display: grid; place-items: center; font: 700 14px var(--sans); box-shadow: 0 0 0 6px color-mix(in srgb, var(--brass) 22%, transparent); }
.beads { display: flex; align-items: center; justify-content: space-between; margin: 16px 22px 0; position: relative; }
.beads::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
.bead { position: relative; width: 46px; height: 46px; flex: none; border-radius: 23px; background: var(--paper); border: 1.5px solid var(--line);
  display: grid; place-items: center; font: 700 18px var(--ar2); color: var(--ink2); }
.bead.done { border-color: var(--good); color: var(--good); }
.bead.now { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); transform: scale(1.12); }
.bottom { position: absolute; left: 20px; right: 20px; bottom: 22px; }
.stopbtn { display: flex; align-items: center; justify-content: center; gap: 10px; height: 58px; border-radius: 16px;
  background: transparent; border: 2px solid var(--ink2); color: var(--ink); font: 650 19px var(--sans); width: 100%; }
.stopbtn i { width: 14px; height: 14px; border-radius: 3px; border: 2px solid var(--bad); }
</style></head>
<body>
<div class="frames">
  <div><div class="label">Home · day</div><div class="phone" id="home-day"></div></div>
  <div><div class="label">Lesson, playing · day</div><div class="phone" id="lesson-day"></div></div>
  <div><div class="label">Home · night</div><div class="phone night" id="home-night"></div></div>
  <div><div class="label">Lesson, playing · night</div><div class="phone night" id="lesson-night"></div></div>
</div>
<template id="tHome">
  <div class="top"><div class="brand">
    <svg class="ros" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="20" cy="20" r="18"/><circle cx="20" cy="20" r="11"/>
      <path d="M20 2v36M2 20h36M7.3 7.3l25.4 25.4M32.7 7.3 7.3 32.7"/><circle cx="20" cy="20" r="4" fill="currentColor"/></svg>Oud Coach</div>
    <svg class="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></div>
  <div class="today">
    <div class="eyebrow">Today · stage 1 of 8</div>
    <h1>Hold, tune,<br>strike</h1>
    <p class="sub">Next: how to sit and hold the oud.</p>
    <button class="cta">Continue<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="neck"><div class="wood"></div><div class="stops">
      <div class="stop here">1</div><div class="stop">2</div><div class="stop">3</div><div class="stop">4</div><div class="stop">5</div><div class="stop">6</div><div class="stop">7</div><div class="stop">8</div></div></div>
    <div class="necklbl"><span>Holding the oud</span><span>Playing songs</span></div>
  </div>
  <div class="rows">
    <div class="row"><svg class="ring" viewBox="0 0 26 26"><circle cx="13" cy="13" r="10" stroke="var(--line)" stroke-width="3" fill="none"/><path d="M13 3a10 10 0 0 1 9.5 7" stroke="var(--brass)" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
      <span><b>Daily practice</b><small>1 of 4 done · about 10 min</small></span><span class="go">Start</span></div>
    <div class="row"><svg viewBox="0 0 24 24"><path d="M4 17a8 8 0 0 1 16 0"/><path d="M12 17l4-6"/></svg><span><b>Tune</b><small>All 6 strings</small></span></div>
    <div class="row"><svg viewBox="0 0 24 24"><path d="M12 3c4.2 0 7.5 2.3 7.5 5.8 0 4.6-4.3 9-7.5 12.2C8.8 17.8 4.5 13.4 4.5 8.8 4.5 5.3 7.8 3 12 3z"/></svg><span><b>Right hand</b><small>Risha strokes and rhythms</small></span></div>
    <div class="row"><span class="song">حب إيه</span><span style="margin-left:4px"><small>Your song · line 1</small></span><span class="go">Play</span></div>
  </div>
</template>
<template id="tLesson">
  <div class="bar"><span class="back">‹</span><span class="title"><span class="ar">حب إيه</span> · Line 1</span>
    <svg class="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></div>
  <div class="steps"><span>Listen</span><span class="on">Slowly</span><span>In time</span></div>
  <div class="hear"><span class="meter"><i></i></span>I hear <span class="ar">صول</span></div>
  <div class="note"><div class="big">ري</div><div class="where">String 3 · open</div>
    <div class="ok"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12l5 5 9-10"/></svg>صول · right</div></div>
  <div class="fret">
    <div class="n" style="top:12px">1</div><div class="s" style="top:20px"></div>
    <div class="n" style="top:30px">2</div><div class="s" style="top:38px"></div>
    <div class="n" style="top:48px">3</div><div class="s" style="top:56px;opacity:1;height:3px;background:var(--brass)"></div>
    <div class="n" style="top:66px">4</div><div class="s" style="top:74px"></div>
    <div class="n" style="top:84px">5</div><div class="s" style="top:92px"></div>
    <div class="dot" style="top:43px;left:52px">0</div>
  </div>
  <div class="beads"><span class="bead done">سي</span><span class="bead done">دو</span><span class="bead done">لا</span><span class="bead done">صول</span><span class="bead now">ري</span><span class="bead">فا</span></div>
  <div class="bottom"><button class="stopbtn"><i></i>Stop</button></div>
</template>
<script>
for (const [id, t] of [['home-day', 'tHome'], ['lesson-day', 'tLesson'], ['home-night', 'tHome'], ['lesson-night', 'tLesson']])
  document.getElementById(id).append(document.getElementById(t).content.cloneNode(true));
</script>
</body></html>
